<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>test</title>
    <link rel="stylesheet" href="style.css">
    <script src="./live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <canvas id="live2d-canvas"></canvas>

    <button id="extra-btn">Menu</button>

    <div id="calibration-ui" class="hidden-top">
        <p style="margin: 0 0 10px 0; font-weight: 600; color: #1d1d1f; font-size: 15px;">Drag line to model's eye level</p>
        <button id="calib-done" class="action-btn" style="width: 100%; text-align: center; background: rgba(52, 199, 89, 0.15); color: #34c759; border: 1px solid rgba(52, 199, 89, 0.3); font-weight: 700;">Done</button>
    </div>

    <div id="calibration-line" class="hidden-fade">
        <div class="calib-handle">↕</div>
    </div>

    <div id="adjust-ui" class="hidden">
        <button id="adj-save" class="adj-btn save">✓</button>
        <button id="adj-cancel" class="adj-btn cancel">✕</button>
        <button id="adj-reset" class="adj-btn reset">Reset</button>
    </div>

    <div id="sidebar">
        <button id="close-btn">✕</button>
        <h2>Control Panel</h2>
<details class="dropdown">
            <summary>Expressions</summary>
            <div id="exp-list" class="button-list"></div>
        </details>

        <details class="dropdown">
            <summary>Motions</summary>
            <div id="mot-list" class="button-list"></div>
        </details>

        <div class="settings-group">
            <div class="toggle-row">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button id="calibrate-btn" class="icon-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <span class="tooltip-text">Calibration</span>
                    </button>
                    <span>Follow Mouse</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="mouse-tracking-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="toggle-row">
                <span>Dark Mode</span>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle-row" style="margin-top: 15px; display: block;">
                <span style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 15px; color: inherit;">Custom Background</span>
                <input type="file" id="bg-upload" accept="image/*" style="display: none;">
                <button id="custom-bg-btn" class="action-btn" style="width: 100%; text-align: center;">Choose Image...</button>
                <div id="bg-file-info" class="bg-info-box">
                    <span id="bg-file-name" class="bg-file-name"></span>
                    <button id="bg-remove-btn" class="bg-remove-btn">×</button>
                </div>
            </div>

            <button id="adjust-btn" class="action-btn" style="width: 100%; margin-top: 15px; text-align: center; background: rgba(0, 122, 255, 0.1); color: #007aff; border: 1px solid rgba(0, 122, 255, 0.2); font-weight: 600;">Adjust Model Position</button>
            <button id="reset-btn" class="action-btn reset-style">Force Reset Model</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
