<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>test</title>
    <link rel="stylesheet" href="style.css">
    <script src="./live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <canvas id="live2d-canvas"></canvas>

    <button id="extra-btn">Menu</button>

    <div id="sidebar">
        <button id="close-btn">✕</button>
        <h2>Control Panel</h2>
        
        <details class="dropdown">
            <summary>Expressions</summary>
            <div id="exp-list" class="button-list"></div>
        </details>

        <details class="dropdown">
            <summary>Motions</summary>
            <div id="mot-list" class="button-list"></div>
        </details>

        <div class="settings-group">
            <div class="toggle-row">
                <span>Mouse Tracking</span>
                <label class="switch">
                    <input type="checkbox" id="mouse-tracking-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="toggle-row">
                <span>Dark Mode</span>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle-row" style="margin-top: 15px; display: block;">
                <span style="display: block; margin-bottom: 8px; font-weight: 600; font-size: 15px; color: inherit;">Custom Background</span>
                <input type="file" id="bg-upload" accept="image/*" style="display: none;">
                <button id="custom-bg-btn" class="action-btn" style="width: 100%; text-align: center;">Choose Image...</button>
                <div id="bg-file-info" class="bg-info-box">
                    <span id="bg-file-name" class="bg-file-name"></span>
                    <button id="bg-remove-btn" class="bg-remove-btn">×</button>
                </div>
            </div>

            <button id="reset-btn" class="action-btn reset-style">Force Reset Model</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
